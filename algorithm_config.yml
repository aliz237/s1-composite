algorithm_name: s1-seasonal-rtc
algorithm_description: >-
  Three seasonal Sentinel-1 OPERA RTC VV/VH means for one bounding box and year.
  Mask and reproject bursts, composite with equal-pass weighting, then apply
  NumPy Refined Lee to seasonal means. Optional nearest-year filling of substantial connected missing patches.
  Writes six Float32 means in a 6-band COG with -9999 nodata, processing
  manifest, optional single-band Int64 exact-count/provenance COG, and optional DPS STAC.
algorithm_version: v0.1.1-rc.1
repository_url: https://github.com/aliz237/s1-composite.git
build_command: s1-composite/build-env.sh
run_command: s1-composite/run.sh
docker_container_url: mas.maap-project.org/root/maap-workspaces/custom_images/maap_base:v4.2.0
queue: maap-dps-worker-16gb
disk_space: 20GB
inputs:
  config: []
  positional:
    - name: bbox
      description: xmin,ymin,xmax,ymax as one comma-separated string in bbox_crs; no dateline crossing.
      default: ''
      required: true
    - name: year
      description: Acquisition year; all three seasons stay within this year.
      default: '2020'
      required: true
    - name: tile_identifier
      description: Tile or area identifier for SAR_S1_YEAR_IDENTIFIER.tif.
      default: ''
      required: true
    - name: crs
      description: Explicit EPSG/PROJ/WKT or @custom_albers.wkt; required without a template. No default CRS.
      default: ''
      required: false
    - name: spacing
      description: Output spacing in metres; ignored if a template is supplied.
      default: '30'
      required: false
    - name: resampling
      description: Backscatter resampling nearest, bilinear or average. Masks always use nearest.
      default: nearest
      required: false
    - name: speckle_filter
      description: true or false; NumPy Refined Lee once on each seasonal mean after compositing.
      default: 'true'
      required: false
    - name: season_windows
      description: Compact JSON month-day interval pairs; {} uses the standard frozen/summer/shoulder windows.
      default: '{}'
      required: false
    - name: write_stac
      description: true or false; disable to write just the raster and processing manifest without STAC.
      default: 'true'
      required: false
    - name: bbox_crs
      description: CRS of bbox coordinates; EPSG/PROJ/WKT or @custom_albers.wkt. Matching output CRS preserves bounds and grid origin.
      default: EPSG:4326
      required: false
    - name: gap_fill
      description: true or false; fill qualifying connected missing patches from complete same-season donor years; per-pixel provenance is available in the optional metadata companion.
      default: 'false'
      required: false
    - name: max_gap_years
      description: Maximum donor distance 0-3 in calendar years; search -1,+1,-2,+2,-3,+3, keeping the first valid donor. Following years only process unresolved qualifying gaps.
      default: '1'
      required: false
    - name: as_of
      description: Exclusive UTC data cutoff as ISO date or timestamp; empty uses job start time. Incomplete donor seasons are skipped.
      default: ''
      required: false
    - name: write_meta
      description: true or false; write an optional single-band Int64 companion COG with exact counts 0-127 and source-year provenance within +/-3 years.
      default: 'false'
      required: false
    - name: gap_min_pixels
      description: Minimum missing component size in pixels, using 8-connectivity; reapplied to residual gaps before further donor searches. Set 1 with gap_core_size 1 for rc.2 all-gap behavior.
      default: '1024'
      required: false
    - name: gap_core_size
      description: Odd side length of a fully missing square neighborhood required inside a qualifying component. Default 7 rejects narrow edge defects. Whole qualifying components are filled.
      default: '7'
      required: false
